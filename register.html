<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Đăng Ký - Quản Lý Nhà Thuốc</title>
    <link rel="stylesheet" href="../css/login.css" />
  </head>
  <body>
    <div class="login-container">
      <div class="login-box">
        <!-- Logo và tiêu đề -->
        <div class="login-header">
          <h1>🏥 Quản Lý Nhà Thuốc</h1>
          <p>Đăng ký hệ thống</p>
        </div>

        <!-- Form đăng ký -->
        <form id="registerForm">
          <div class="form-group">
            <label for="username">Tên đăng ký</label>
            <input
              type="text"
              id="username"
              name="username"
              required
              placeholder="Nhập tên đăng nhập"
            />
          </div>

          <div class="form-group">
            <label for="password">Mật khẩu</label>
            <input
              type="password"
              id="password"
              name="password"
              required
              placeholder="Nhập mật khẩu"
            />
          </div>

          <div class="form-group">
            <label for="confirmPassword">Nhập lại mật khẩu</label>
            <input
              type="password"
              id="confirmPassword"
              name="confirmPassword"
              required
              placeholder="Nhập lại mật khẩu"
            />
          </div>

          <!-- Thông báo lỗi -->
          <div id="errorMessage" class="error-message"></div>

          <!-- Thông báo thành công -->
          <div id="successMessage" class="success-message"></div>

          <button type="submit" class="btn-login">Đăng ký ngay</button>
          <a href="login.html">Đã có tài khoản ? Đăng nhập</a>
        </form>

        <div class="login-footer">
          <p>© 2026 Quản Lý Nhà Thuốc Y Tế</p>
        </div>
      </div>
    </div>

    <script src="../js/register.js"></script>
  </body>
</html>
