<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Thanh toán</title>
  <link rel="stylesheet" href="../css/checkout.css" />
</head>
<body>

  <h1 class="text-center">💳 Thanh toán</h1>

  <!-- Nút trở về -->
  <div class="back-home">
    <a href="index.html">⬅ Trở về trang chủ</a>
  </div>

  <div class="checkout-container">
    <!-- SẢN PHẨM -->
    <div class="checkout-card">
      <h2>🛒 Sản phẩm trong đơn</h2>
      <div id="checkoutItems"></div>
    </div>

    <!-- THÔNG TIN + THANH TOÁN -->
    <div class="checkout-card">
      <h2>📦 Thông tin thanh toán</h2>

      <div class="form-group">
        <label>Họ và tên</label>
        <input type="text" id="fullName" placeholder="Nhập họ tên người nhận">
      </div>

      <div class="form-group">
        <label>Số điện thoại</label>
        <input type="text" id="phone" placeholder="Nhập số điện thoại">
      </div>

      <div class="form-group">
        <label>Địa chỉ giao hàng</label>
        <textarea id="address" rows="3" placeholder="Nhập địa chỉ nhận hàng"></textarea>
      </div>

      <div class="form-group">
        <label>Phương thức thanh toán</label>
        <select id="paymentMethod">
          <option value="">-- Chọn phương thức --</option>
          <option value="COD">Thanh toán khi nhận hàng (COD)</option>
          <option value="BANK">Chuyển khoản ngân hàng</option>
          <option value="MOMO">Ví MoMo</option>
        </select>
      </div>

      <p class="total">
        Tổng tiền: <span id="totalPrice">0</span>đ
      </p>

      <button class="btn-primary" onclick="handleCheckout()">
        Xác nhận thanh toán
      </button>
    </div>
  </div>

  <script src="../js/checkout.js"></script>
</body>
</html>
