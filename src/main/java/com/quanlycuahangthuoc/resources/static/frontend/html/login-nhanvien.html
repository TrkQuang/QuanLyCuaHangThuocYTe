<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Đăng nhập nhân viên - Quản lý nhà thuốc</title>
    <link rel="stylesheet" href="../css/login-nhanvien.css" />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"
    />
  </head>
  <body>
    <div class="container">
      <div class="login-box">
        <div class="login-header">
          <div class="icon-wrapper">
            <i class="fas fa-user-md"></i>
          </div>
          <h1>Đăng nhập nhân viên</h1>
          <p>Quản lý cửa hàng thuốc y tế</p>
        </div>

        <form class="login-form" id="loginForm">
          <div class="form-group">
            <label for="username">
              <i class="fas fa-user"></i>
              Tên đăng nhập
            </label>
            <input
              type="text"
              id="username"
              name="username"
              placeholder="Nhập tên đăng nhập"
              required
              autocomplete="username"
            />
          </div>

          <div class="form-group">
            <label for="password">
              <i class="fas fa-lock"></i>
              Mật khẩu
            </label>
            <div class="password-wrapper">
              <input
                type="password"
                id="password"
                name="password"
                placeholder="Nhập mật khẩu"
                required
                autocomplete="current-password"
              />
              <button
                type="button"
                class="toggle-password"
                onclick="togglePassword()"
              >
                <i class="fas fa-eye" id="toggleIcon"></i>
              </button>
            </div>
          </div>

          <div class="form-options">
            <label class="remember-me">
              <input type="checkbox" id="rememberMe" name="rememberMe" />
              <span>Ghi nhớ đăng nhập</span>
            </label>
            <a href="#" class="forgot-password">Quên mật khẩu?</a>
          </div>

          <button type="submit" class="btn-login">
            <i class="fas fa-sign-in-alt"></i>
            Đăng nhập
          </button>

          <div class="error-message" id="errorMessage"></div>
        </form>

        <div class="login-footer">
          <p>© 2026 Quản lý cửa hàng thuốc y tế</p>
        </div>
      </div>

      <div class="background-shapes">
        <div class="shape shape-1"></div>
        <div class="shape shape-2"></div>
        <div class="shape shape-3"></div>
      </div>
    </div>

    <script>
      function togglePassword() {
        const passwordInput = document.getElementById("password");
        const toggleIcon = document.getElementById("toggleIcon");

        if (passwordInput.type === "password") {
          passwordInput.type = "text";
          toggleIcon.classList.remove("fa-eye");
          toggleIcon.classList.add("fa-eye-slash");
        } else {
          passwordInput.type = "password";
          toggleIcon.classList.remove("fa-eye-slash");
          toggleIcon.classList.add("fa-eye");
        }
      }

      document
        .getElementById("loginForm")
        .addEventListener("submit", function (e) {
          e.preventDefault();

          const username = document.getElementById("username").value;
          const password = document.getElementById("password").value;
          const errorMessage = document.getElementById("errorMessage");

          // Ví dụ xử lý đăng nhập (thay thế bằng API thực tế)
          if (username && password) {
            // Gọi API đăng nhập ở đây
            console.log("Đăng nhập với:", { username, password });
            errorMessage.textContent = "";
            // Chuyển hướng sau khi đăng nhập thành công
            // window.location.href = '/dashboard';
          } else {
            errorMessage.textContent = "Vui lòng nhập đầy đủ thông tin!";
          }
        });
    </script>
  </body>
</html>
