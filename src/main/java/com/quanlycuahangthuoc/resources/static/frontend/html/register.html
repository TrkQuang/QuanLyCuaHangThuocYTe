<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Đăng Ký - Quản Lý Nhà Thuốc</title>
    <link rel="stylesheet" href="../css/login.css" />
    <link rel="stylesheet" href="../css/design-system.css" />
  </head>
  <body class="register-page">
    <div class="login-container">
      <div class="login-box">
        <!-- Logo và tiêu đề -->
        <div class="login-header">
          <h1>🏥 Quản Lý Nhà Thuốc</h1>
          <p>Đăng ký hệ thống</p>
        </div>

        <!-- Form đăng ký -->
        <form id="registerForm">
          <div class="form-group">
            <label for="fullName">Họ và tên</label>
            <input
              type="text"
              id="fullName"
              name="fullName"
              required
              placeholder="Nhập họ và tên đầy đủ"
            />
          </div>

          <div class="form-group">
            <label for="username">Tên đăng nhập</label>
            <input
              type="text"
              id="username"
              name="username"
              required
              placeholder="Nhập tên đăng nhập"
            />
          </div>

          <div class="form-group">
            <label for="email">Email</label>
            <input
              type="email"
              id="email"
              name="email"
              required
              placeholder="Nhập email"
            />
          </div>

          <div class="form-group">
            <label for="phone">Số điện thoại</label>
            <input
              type="tel"
              id="phone"
              name="phone"
              required
              placeholder="Nhập số điện thoại"
            />
          </div>

          <div class="form-group">
            <label for="birthDate">Ngày sinh</label>
            <input type="date" id="birthDate" name="birthDate" required />
          </div>

          <div class="form-group">
            <label for="gender">Giới tính</label>
            <select id="gender" name="gender" required>
              <option value="">Chọn giới tính</option>
              <option value="Nam">Nam</option>
              <option value="Nu">Nữ</option>
              <option value="Khac">Khác</option>
            </select>
          </div>

          <div class="form-group full-width">
            <label for="address">Địa chỉ</label>
            <input
              type="text"
              id="address"
              name="address"
              required
              placeholder="Nhập địa chỉ"
            />
          </div>

          <div class="form-group full-width">
            <label for="medicalHistory">Tiền sử bệnh lý</label>
            <textarea
              id="medicalHistory"
              name="medicalHistory"
              required
              placeholder="Ví dụ: Viêm mũi dị ứng, dạ dày..."
              rows="3"
            ></textarea>
          </div>

          <div class="form-group">
            <label for="password">Mật khẩu</label>
            <input
              type="password"
              id="password"
              name="password"
              required
              placeholder="Nhập mật khẩu (ít nhất 6 ký tự)"
            />
          </div>

          <div class="form-group">
            <label for="confirmPassword">Nhập lại mật khẩu</label>
            <input
              type="password"
              id="confirmPassword"
              name="confirmPassword"
              required
              placeholder="Nhập lại mật khẩu"
            />
          </div>

          <!-- Thông báo lỗi -->
          <div id="errorMessage" class="error-message full-width"></div>

          <!-- Thông báo thành công -->
          <div id="successMessage" class="success-message full-width"></div>

          <button type="submit" class="btn-login full-width">Đăng ký ngay</button>
          <a href="login.html" class="register-link full-width"
            >Đã có tài khoản ? Đăng nhập</a
          >
        </form>

        <div class="login-footer">
          <p>© 2026 Quản Lý Nhà Thuốc Y Tế</p>
        </div>
      </div>
    </div>
    <script src="../js/config.js"></script>
    <script src="../js/ui-layout.js"></script>
    <script src="../js/register.js"></script>
  </body>
</html>
