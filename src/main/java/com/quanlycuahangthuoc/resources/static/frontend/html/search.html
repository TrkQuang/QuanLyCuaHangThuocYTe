<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Kết quả tìm kiếm - Nhà Thuốc</title>
    <link rel="stylesheet" href="../css/style.css" />
    <link rel="stylesheet" href="../css/design-system.css" />
    <style>
      .search-shell {
        padding: 30px 0 56px;
        background: linear-gradient(180deg, #f8fafc 0%, #eef2ff 55%, #ffffff 100%);
        min-height: calc(100vh - 200px);
      }

      .search-hero {
        background: #ffffff;
        border: 1px solid #e5e7eb;
        border-radius: 16px;
        padding: 22px;
        margin-bottom: 20px;
        box-shadow: 0 10px 25px rgba(15, 23, 42, 0.06);
      }

      .search-hero h1 {
        margin: 0;
        color: #0f172a;
        font-size: 30px;
      }

      .search-hero p {
        margin-top: 8px;
        color: #475569;
      }

      .search-empty {
        text-align: center;
        font-size: 18px;
        color: #64748b;
        background: #ffffff;
        border: 1px solid #e5e7eb;
        border-radius: 14px;
        padding: 28px;
      }
    </style>
  </head>
  <body>
    <script src="../js/shared-header-loader.js" data-active="shop"></script>

    <main class="search-shell">
      <section>
        <div class="container">
          <div class="search-hero">
            <h1>Kết quả tìm kiếm</h1>
            <p>Từ khóa: <strong id="searchKeyword"></strong></p>
          </div>

          <div class="products-grid" id="searchResults"></div>
        </div>
      </section>
    </main>

    <footer class="footer">
      <div class="container">
        <div class="footer-content">
          <div class="footer-section">
            <h3>Nhà Thuốc</h3>
            <p>Cửa hàng thuốc trực tuyến uy tín</p>
          </div>
        </div>
      </div>
    </footer>

    <script>
      document.addEventListener("DOMContentLoaded", () => {
        const urlParams = new URLSearchParams(window.location.search);
        const keyword = urlParams.get("q") || "";

        document.getElementById("searchKeyword").textContent =
          keyword || "Tất cả";

        // Danh sách sản phẩm
        const allProducts = [
          {
            id: "T1",
            name: "Panadol Extra",
            price: "20.000đ",
            desc: "Hộp 24 viên - Giảm đau, hạ sốt",
            img: "OIP (2).jpg",
          },
          {
            id: "T2",
            name: "Vitamin C 1000mg",
            price: "70.000đ",
            desc: "Hộp 30 viên - Tăng sức đề kháng",
            img: "thuoc-vitamin-c-tw3-500mg-dieu-tri-thieu-hut-vitamin-c-65f15f008f538.jpg",
          },
          {
            id: "T3",
            name: "Amoxicillin",
            price: "25.000đ",
            desc: "Hộp 20 viên - Kháng sinh",
            img: "OIP.jpg",
          },
          {
            id: "laroche",
            name: "Kem chống nắng La Roche",
            price: "400.000đ",
            desc: "SPF 60+ PA++++",
            img: "36dea234165d80e3db8d4ec7a12be007.jpg",
          },
          {
            id: "head&shoulder",
            name: "Dầu gội Head & Shoulder",
            price: "90.000đ",
            desc: "Chai 500ml - Trị gàu",
            img: "OIP (1).jpg",
          },
        ];

        const resultsContainer = document.getElementById("searchResults");
        const lowerKeyword = keyword.toLowerCase().trim();

        const filtered = allProducts.filter(
          (p) =>
            p.name.toLowerCase().includes(lowerKeyword) ||
            p.desc.toLowerCase().includes(lowerKeyword),
        );

        if (filtered.length === 0) {
          resultsContainer.innerHTML =
            '<p class="search-empty">Không tìm thấy sản phẩm nào phù hợp.</p>';
          return;
        }

        filtered.forEach((p) => {
          const item = document.createElement("div");
          item.className = "product-item";
          item.innerHTML = `
          <img src="${p.img}" alt="${p.name}" />
          <h3>${p.name}</h3>
          <div class="product-price">${p.price}</div>
          <p>${p.desc}</p>
          <button class="btn-primary" onclick="addToCart('${p.id}')">Thêm giỏ hàng</button>
        `;
          resultsContainer.appendChild(item);
        });
      });
    </script>

    <script src="../js/config.js"></script>
    <script src="../js/ui-layout.js"></script>
    <script src="../js/header.js"></script>
    <script src="../js/cart.js"></script>
  </body>
</html>
