<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <title>Giỏ hàng</title>
  <link rel="stylesheet" href="../css/cart.css">
</head>
<body>

<div class="cart-wrapper">
  <h2>🛒 Giỏ hàng của bạn</h2>

  <div class="cart-card">
    <table>
      <thead>
        <tr>
          <th>Sản phẩm</th>
          <th>Giá</th>
          <th>Số lượng</th>
          <th>Thành tiền</th>
          <th></th>
        </tr>
      </thead>
      <tbody id="cart-items"></tbody>
    </table>

    <div class="cart-footer">
      <div class="total-box">
        <span>Tổng thanh toán</span>
        <strong><span id="total-price">0</span> VNĐ</strong>
      </div>

      <div class="cart-actions">
        <a href="index.html" class="btn secondary">⬅ Tiếp tục mua sắm</a>
        <a href="checkout.html" class="btn primary">Thanh toán</a>
      </div>
    </div>
  </div>
</div>

<script src="../js/add-cart.js"></script>
</body>
</html>
