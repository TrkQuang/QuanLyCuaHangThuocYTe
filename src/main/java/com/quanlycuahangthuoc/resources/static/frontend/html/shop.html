<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Cửa hàng</title>
    <link rel="stylesheet" href="../css/style.css" />
    <link rel="stylesheet" href="../css/design-system.css" />
    <style>
      .shop-shell {
        padding: 36px 0 60px;
        min-height: calc(100vh - 200px);
      }

      .shop-hero {
        background: linear-gradient(135deg, #f8fbff 0%, #eef3ff 100%);
        border: 1px solid #dbe7ff;
        border-radius: 16px;
        padding: 24px;
        margin-bottom: 20px;
      }

      .shop-hero h1 {
        margin: 0;
        font-size: 34px;
        color: #1f2a44;
      }

      .shop-hero p {
        margin: 8px 0 0;
        color: #4b5a79;
        font-size: 16px;
      }

      .shop-controls {
        background: #fff;
        border: 1px solid #dbe7ff;
        border-radius: 16px;
        padding: 18px;
        margin-bottom: 24px;
      }

      .shop-controls-grid {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
        gap: 12px;
      }

      .shop-controls label {
        font-size: 12px;
        font-weight: 700;
        color: #64748b;
        margin-bottom: 6px;
        display: block;
        text-transform: uppercase;
      }

      .shop-summary {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-bottom: 12px;
        color: #475569;
      }

      #dynamicProductsGrid .btn-primary {
        width: 100%;
        padding: 10px 12px;
        margin-top: 8px;
      }

      .shop-pagination-wrap {
        margin-top: 22px;
        display: flex;
        flex-wrap: wrap;
        align-items: center;
        gap: 10px;
        justify-content: center;
      }

      .shop-page-btn {
        border: 1px solid #c7d2fe;
        background: #fff;
        border-radius: 8px;
        min-width: 40px;
        height: 38px;
        font-weight: 700;
        color: #334155;
        cursor: pointer;
      }

      .shop-page-btn.active {
        background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        color: #fff;
        border: none;
      }

      #shopLoadMoreBtn {
        padding: 10px 18px;
      }
    </style>
  </head>
  <body>
    <!--Header-->
    <header class="header">
      <div class="header-top">
        <div class="container">
          Hotline: 19001514 | Giao hàng miễn phí từ 200k
        </div>
      </div>
      <div class="header-main">
        <div class="container">
          <div class="content">
            <a href="index.html" class="logo">🏥 Nhà Thuốc</a>
            <div class="search-box">
              <form id="searchForm" action="search.html" method="get">
                <input
                  type="text"
                  id="searchInput"
                  name="q"
                  placeholder="Tìm kiếm thuốc......."
                  autocomplete="off"
                />
                <button type="submit" class="search-btn">🔍 Tìm</button>
              </form>
            </div>
            <div class="menu">
              <a href="login.html" id="loginLink">👤 Đăng nhập</a>
              <a href="cart.html"
                >🛒 Giỏ hàng (<span id="cartCount">0</span>)</a
              >
            </div>
          </div>
        </div>
      </div>
    </header>

    <!--Navigation-->
    <nav class="nav">
      <div class="container">
        <ul>
          <li><a href="index.html">🏠 Trang chủ</a></li>
          <li><a href="shop.html" class="active">💊 Sản phẩm</a></li>
          <li><a href="cart.html">🛒 Giỏ hàng</a></li>
          <li><a href="order-history.html">📋 Đơn hàng</a></li>
          <li><a href="profile.html">👤 Tài khoản</a></li>
        </ul>
      </div>
    </nav>
    <main class="shop-shell">
      <div class="container">
        <section class="shop-controls" id="shopControls">
          <div class="shop-controls-grid">
            <div>
              <label for="shopKeyword">Tên thuốc</label>
              <input
                id="shopKeyword"
                class="control"
                type="text"
                placeholder="Nhập tên thuốc..."
              />
            </div>
            <div>
              <label for="shopPriceFilter">Khoảng giá</label>
              <select id="shopPriceFilter" class="control">
                <option value="">Tất cả</option>
                <option value="lt5000">Dưới 10.000đ</option>
                <option value="5000-10000">10.000đ - 50.000đ</option>
                <option value="gt20000">Trên 50.000đ</option>
              </select>
            </div>
            <div>
              <label for="shopSortBy">Sắp xếp</label>
              <select id="shopSortBy" class="control">
                <option value="name-asc">Tên A-Z</option>
                <option value="name-desc">Tên Z-A</option>
                <option value="price-asc">Giá tăng dần</option>
                <option value="price-desc">Giá giảm dần</option>
                <option value="stock-desc">Tồn kho giảm dần</option>
              </select>
            </div>
          </div>
          <div style="display: flex; gap: 10px; margin-top: 12px">
            <button class="btn-primary" id="shopApplyFilterBtn">Áp dụng</button>
            <button
              class="btn btn-secondary"
              id="shopResetFilterBtn"
              type="button"
            >
              Đặt lại
            </button>
          </div>
        </section>

        <div class="shop-summary">
          <strong id="shopCountInfo">0 sản phẩm</strong>
          <span id="shopPageInfo">Trang 1/1</span>
        </div>

        <section>
          <div class="products-grid" id="dynamicProductsGrid">
            <p style="grid-column: 1 / -1; text-align: center; color: #718096">
              Đang tải danh sách thuốc...
            </p>
          </div>

          <div class="shop-pagination-wrap">
            <div id="shopPagination"></div>
            <button id="shopLoadMoreBtn" class="btn btn-warning" type="button">
              Xem thêm
            </button>
          </div>
        </section>
      </div>
    </main>

    <footer class="footer">
      <div class="container">
        <div class="footer-content">
          <div class="footer-section">
            <h3>Nhà Thuốc</h3>
            <p>Cửa hàng thuốc trực tuyến uy tín</p>
          </div>
        </div>
      </div>
    </footer>

    <script src="../js/config.js"></script>
    <script src="../js/ui-layout.js"></script>
    <script src="../js/header.js"></script>
    <script src="../js/cart.js"></script>
    <script src="../js/khachhang.js"></script>
  </body>
</html>
