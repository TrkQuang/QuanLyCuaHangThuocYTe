<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Đăng Nhập - Quản Lý Cửa Hàng Thuốc</title>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      body {
        font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
        background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        min-height: 100vh;
        display: flex;
        justify-content: center;
        align-items: center;
      }

      .login-container {
        background: white;
        padding: 40px;
        border-radius: 15px;
        box-shadow: 0 15px 35px rgba(0, 0, 0, 0.2);
        width: 100%;
        max-width: 420px;
      }

      .login-header {
        text-align: center;
        margin-bottom: 30px;
      }

      .logo {
        font-size: 60px;
        margin-bottom: 15px;
      }

      h2 {
        color: #333;
        font-size: 28px;
        margin-bottom: 10px;
      }

      .subtitle {
        color: #666;
        font-size: 14px;
      }

      .form-group {
        margin-bottom: 20px;
      }

      label {
        display: block;
        color: #333;
        font-weight: 600;
        margin-bottom: 8px;
        font-size: 14px;
      }

      .input-group {
        position: relative;
      }

      .input-icon {
        position: absolute;
        left: 15px;
        top: 50%;
        transform: translateY(-50%);
        color: #999;
        font-size: 18px;
      }

      input {
        width: 100%;
        padding: 12px 15px 12px 45px;
        border: 2px solid #e1e8ed;
        border-radius: 8px;
        font-size: 15px;
        transition: all 0.3s;
      }

      input:focus {
        outline: none;
        border-color: #667eea;
        box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.1);
      }

      .remember-group {
        display: flex;
        align-items: center;
        margin-bottom: 20px;
      }

      .remember-group input[type="checkbox"] {
        width: auto;
        margin-right: 8px;
        padding: 0;
      }

      .remember-group label {
        margin: 0;
        font-weight: 400;
        font-size: 14px;
        cursor: pointer;
      }

      .btn-login {
        width: 100%;
        padding: 14px;
        background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        color: white;
        border: none;
        border-radius: 8px;
        font-size: 16px;
        font-weight: 600;
        cursor: pointer;
        transition: transform 0.2s;
      }

      .btn-login:hover {
        transform: translateY(-2px);
        box-shadow: 0 5px 15px rgba(102, 126, 234, 0.4);
      }

      .btn-login:active {
        transform: translateY(0);
      }

      .alert {
        padding: 12px;
        border-radius: 8px;
        margin-bottom: 20px;
        display: none;
        font-size: 14px;
      }

      .alert-error {
        background-color: #fee;
        color: #c33;
        border: 1px solid #fcc;
      }

      .alert-success {
        background-color: #efe;
        color: #3c3;
        border: 1px solid #cfc;
      }

      .footer-text {
        text-align: center;
        margin-top: 20px;
        color: #666;
        font-size: 13px;
      }

      .default-accounts {
        background: #f8f9fa;
        padding: 15px;
        border-radius: 8px;
        margin-top: 20px;
        font-size: 13px;
      }

      .default-accounts h4 {
        color: #667eea;
        margin-bottom: 10px;
        font-size: 14px;
      }

      .default-accounts p {
        color: #666;
        margin: 5px 0;
      }

      .default-accounts strong {
        color: #333;
      }
    </style>
  </head>
  <body>
    <div class="login-container">
      <div class="login-header">
        <div class="logo">💊</div>
        <h2>Đăng Nhập</h2>
        <p class="subtitle">Hệ thống quản lý cửa hàng thuốc</p>
      </div>

      <div id="alertBox" class="alert"></div>

      <form id="loginForm">
        <div class="form-group">
          <label for="username">Tên đăng nhập</label>
          <div class="input-group">
            <span class="input-icon">👤</span>
            <input
              type="text"
              id="username"
              placeholder="Nhập tên đăng nhập"
              required
              autocomplete="username"
            />
          </div>
        </div>

        <div class="form-group">
          <label for="password">Mật khẩu</label>
          <div class="input-group">
            <span class="input-icon">🔒</span>
            <input
              type="password"
              id="password"
              placeholder="Nhập mật khẩu"
              required
              autocomplete="current-password"
            />
          </div>
        </div>

        <div class="remember-group">
          <input type="checkbox" id="remember" />
          <label for="remember">Ghi nhớ đăng nhập</label>
        </div>

        <button type="submit" class="btn-login">Đăng Nhập</button>
      </form>

      <div class="default-accounts">
        <h4>🔑 Tài khoản mặc định:</h4>
        <p><strong>Admin:</strong> admin / admin</p>
        <p><strong>Nhân viên:</strong> Tài khoản từ database</p>
      </div>

      <div class="footer-text">© 2026 Quản Lý Cửa Hàng Thuốc</div>
    </div>

    <script src="../js/login.js"></script>
  </body>
</html>
