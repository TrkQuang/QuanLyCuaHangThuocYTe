<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Đăng Nhập - Quản Lý Nhà Thuốc</title>
    <link rel="stylesheet" href="../css/login.css" />
    <link rel="stylesheet" href="../css/design-system.css" />
  </head>
  <body>
    <div class="login-container">
      <div class="login-box">
        <!-- Logo và tiêu đề -->
        <div class="login-header">
          <h1>🏥 Quản Lý Nhà Thuốc</h1>
          <p>Đăng nhập hệ thống</p>
        </div>

        <!-- Form đăng nhập -->
        <form id="loginForm">
          <div class="form-group">
            <label for="username" class="label-with-icon">
              <img
                src="img/icon/account.png"
                alt="Tài khoản"
                class="label-icon"
              />
              <span>Tên đăng nhập</span>
            </label>
            <input
              type="text"
              id="username"
              name="username"
              required
              placeholder="Nhập tên đăng nhập"
            />
          </div>

          <div class="form-group">
            <label for="password" class="label-with-icon">
              <img
                src="img/icon/password.png"
                alt="Mật khẩu"
                class="label-icon"
              />
              <span>Mật khẩu</span>
            </label>
            <input
              type="password"
              id="password"
              name="password"
              required
              placeholder="Nhập mật khẩu"
            />
          </div>

          <!-- Hiển thị lỗi nếu có -->
          <div id="errorMessage" class="error-message"></div>

          <button type="submit" class="btn-login">Đăng Nhập</button>

          <div class="register-link">
            <p>
              Chưa có tài khoản?
              <a href="register.html">Đăng ký ngay</a>
            </p>
          </div>
        </form>

        <div class="login-footer">
          <p>© 2026 Quản Lý Nhà Thuốc Y Tế</p>
        </div>
      </div>
    </div>

    <script src="../js/config.js"></script>
    <script src="../js/ui-layout.js"></script>
    <script src="../js/login.js"></script>
  </body>
</html>
