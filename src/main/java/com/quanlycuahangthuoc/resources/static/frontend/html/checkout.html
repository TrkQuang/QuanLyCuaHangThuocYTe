<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Thanh toán</title>
    <link rel="stylesheet" href="../css/style.css" />
    <link rel="stylesheet" href="../css/checkout.css" />
    <link rel="stylesheet" href="../css/design-system.css" />
    <style>
      .checkout-shell {
        padding: 32px 0 60px;
        background: radial-gradient(circle at top right, #edf2ff 0, #f8fafc 45%, #ffffff 100%);
        min-height: calc(100vh - 200px);
      }

      .checkout-hero {
        background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        color: white;
        border-radius: 18px;
        padding: 28px;
        margin-bottom: 20px;
        box-shadow: 0 12px 28px rgba(102, 126, 234, 0.28);
      }

      .checkout-hero h1 {
        margin: 0;
        font-size: 34px;
        color: white;
      }

      .checkout-hero p {
        margin-top: 10px;
        opacity: 0.95;
      }

      .checkout-back {
        margin-bottom: 18px;
      }

      .checkout-back a {
        display: inline-flex;
        align-items: center;
        gap: 6px;
        text-decoration: none;
      }
    </style>
  </head>
  <body>
    <script src="../js/shared-header-loader.js" data-active="cart"></script>

    <main class="checkout-shell">
      <div class="container">
        <section class="checkout-hero">
          <h1>💳 Thanh toán</h1>
          <p>Xác nhận thông tin nhận hàng và hoàn tất đơn mua của bạn.</p>
        </section>

        <div class="checkout-back">
          <a class="btn btn-secondary" href="cart.html">⬅ Trở về giỏ hàng</a>
        </div>

        <div class="checkout-container">
          <!-- SẢN PHẨM -->
          <div class="checkout-card">
            <h2>🛒 Sản phẩm trong đơn</h2>
            <div id="checkoutItems"></div>
          </div>

          <!-- THÔNG TIN + THANH TOÁN -->
          <div class="checkout-card">
            <h2>📦 Thông tin thanh toán</h2>

            <div class="form-group">
              <label>Họ và tên</label>
              <input
                type="text"
                id="fullName"
                placeholder="Nhập họ tên người nhận"
              />
            </div>

            <div class="form-group">
              <label>Số điện thoại</label>
              <input type="text" id="phone" placeholder="Nhập số điện thoại" />
            </div>

            <div class="form-group">
              <label>Địa chỉ giao hàng</label>
              <textarea
                id="address"
                rows="3"
                placeholder="Nhập địa chỉ nhận hàng"
              ></textarea>
            </div>

            <div class="form-group">
              <label>Phương thức thanh toán</label>
              <select id="paymentMethod">
                <option value="">-- Chọn phương thức --</option>
                <option value="COD">Thanh toán khi nhận hàng (COD)</option>
                <option value="BANK">Chuyển khoản ngân hàng</option>
                <option value="MOMO">Ví MoMo</option>
              </select>
            </div>

            <p class="total">Tổng tiền: <span id="totalPrice">0</span>đ</p>

            <button class="btn-primary" onclick="handleCheckout()">
              Xác nhận thanh toán
            </button>
          </div>
        </div>
      </div>
    </main>

    <footer class="footer">
      <div class="container">
        <div class="footer-content">
          <div class="footer-section">
            <h3>Nhà Thuốc</h3>
            <p>Cửa hàng thuốc trực tuyến uy tín</p>
          </div>
        </div>
      </div>
    </footer>

    <script src="../js/config.js"></script>
    <script src="../js/ui-layout.js"></script>
    <script src="../js/header.js"></script>
    <script src="../js/cart.js"></script>
    <script src="../js/checkout.js"></script>
  </body>
</html>
